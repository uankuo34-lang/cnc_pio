; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

build_unflags = -std=gnu++11 -std=gnu++14  ; 移除低版本标准

lib_deps = 
	adafruit/SdFat - Adafruit Fork@^2.3.102
	tgolla/GCodeParser@^1.3.0
	alkonosst/RTOScppESP32@^1.0.2
	SIP
	WiFi
	SPI
build_flags = 
	-I main/bsp
	-I main/driver/MotorMotion
	-I main/driver/MotorWrite
	-I main/middleware/SdControl
	-I main/middleware/WiFiCommunication
	-I main/middleware/Probe
	-std=gnu++17     ; 强制开启 C++17 标准
